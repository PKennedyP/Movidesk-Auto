<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Auto Movidesk — Presets</title>
<link rel="stylesheet" href="ui.css" />
<style>
  body { height: 100vh; display: flex; flex-direction: column; }
  .topo { padding: 12px 18px; }
  .topo .busca { max-width: 340px; }
  .espaco { flex: 1; }
  .corpo { flex: 1; display: flex; min-height: 0; }
  .coluna-lista {
    width: 320px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--linha); min-height: 0;
  }
  .coluna-lista .lista { flex: 1; }
  .contador { padding: 8px 14px; font-size: 11px; color: var(--tinta-suave); border-top: 1px solid var(--linha); background: var(--cartao); }

  .editor { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px; }
  .editor-limite { max-width: 720px; }
  .dois { display: flex; gap: 12px; }
  .dois > .campo { flex: 1; }
  #texto { min-height: 190px; }

  details.bloco {
    border: 1px solid var(--linha); border-radius: 8px;
    background: var(--cartao); margin-bottom: 14px;
  }
  details.bloco > summary {
    padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 12.5px;
    color: var(--tinta-suave); list-style: none; display: flex; align-items: center; gap: 8px;
  }
  details.bloco > summary::-webkit-details-marker { display: none; }
  details.bloco > summary::before {
    content: "▸"; font-size: 10px; transition: transform .15s ease;
  }
  details.bloco[open] > summary::before { transform: rotate(90deg); }
  details.bloco[open] > summary { border-bottom: 1px solid var(--linha); color: var(--verde-escuro); }
  .bloco-corpo { padding: 14px 12px 4px; }

  .acoes { display: flex; gap: 8px; align-items: center; padding-top: 4px; }
  .acoes .espaco { flex: 1; }

  .config {
    border-top: 1px solid var(--linha); background: var(--cartao);
    padding: 12px 18px; display: none; gap: 26px;
  }
  /* wrap para o resumo da importação poder ocupar a linha inteira embaixo
     dos três blocos, sem espremer nenhum deles. */
  .config.aberta { display: flex; flex-wrap: wrap; }
  .config .linha-switch { max-width: 360px; }
  .acoes-backup { display: flex; gap: 8px; margin-top: 6px; }
  .resumo-import {
    flex-basis: 100%; display: none; margin-top: 12px;
    border: 1px solid var(--linha); border-radius: 8px;
    background: var(--fundo); padding: 12px 14px; font-size: 12.5px;
  }
  .resumo-import.visivel { display: block; }
  .resumo-import ul { margin: 8px 0 10px 18px; }
  .resumo-import .acoes { display: flex; gap: 8px; }

  /* Só o dashboard tem dois toasts ao mesmo tempo. O de erro sobe para nunca
     cobrir o botão Desfazer, que é o único jeito de recuperar uma exclusão —
     e os dois aparecem juntos justamente quando algo deu errado. No popup
     esta regra não existe, porque lá ela cairia sobre o botão Preencher. */
  #erro.toast { bottom: 76px; }
</style>
</head>
<body>
  <div class="topo">
    <div class="logo" aria-hidden="true"></div>
    <div class="marca">Auto Movidesk</div>
    <div class="busca"><input type="text" id="busca" placeholder="Buscar preset, comando ou texto…" /></div>
    <div class="espaco"></div>
    <button class="btn" id="btn-config">Configurações</button>
    <button class="btn btn-primario" id="novo">+ Novo preset</button>
  </div>

  <div class="config" id="config">
    <div class="linha-switch">
      <div><div style="font-weight:600">Extensão ativa</div>
        <div class="dica">Responde as enquetes e resolve o status automaticamente.</div></div>
      <label class="switch"><input type="checkbox" id="toggle-enabled" checked /><span class="trilho"></span></label>
    </div>
    <div class="linha-switch">
      <div><div style="font-weight:600">Exigir delimitador</div>
        <div class="dica">O comando só dispara após espaço ou pontuação.</div></div>
      <label class="switch"><input type="checkbox" id="toggle-delimitador" /><span class="trilho"></span></label>
    </div>
    <div class="bloco-backup">
      <div style="font-weight:600">Backup dos presets</div>
      <div class="acoes-backup">
        <button class="btn" id="exportar">Exportar</button>
        <button class="btn" id="importar">Importar</button>
        <input type="file" id="arquivo-import" accept=".json,application/json" hidden />
      </div>
    </div>
    <div class="resumo-import" id="resumo-import"></div>
  </div>

  <div class="corpo">
    <div class="coluna-lista">
      <ul class="lista" id="lista" role="listbox"></ul>
      <div class="contador" id="contador"></div>
    </div>
    <div class="editor" id="editor"></div>
  </div>

  <div class="toast" id="toast">
    <span id="toast-texto"></span>
    <button id="toast-desfazer">Desfazer</button>
  </div>

  <div class="toast" id="erro"><span id="erro-texto"></span></div>

<script src="presets.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
