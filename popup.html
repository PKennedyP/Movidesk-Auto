<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Auto Movidesk</title>
<link rel="stylesheet" href="ui.css" />
<style>
  body { width: 740px; display: flex; flex-direction: column; height: 520px; }
  .corpo { flex: 1; display: flex; min-height: 0; }
  .coluna-lista {
    width: 290px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--linha); min-height: 0;
  }
  .coluna-lista .lista { flex: 1; }
  .contador { padding: 7px 12px; font-size: 11px; color: var(--tinta-suave); border-top: 1px solid var(--linha); background: var(--cartao); }
  .painel { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 14px 16px; gap: 12px; }
  .painel-cabeca { display: flex; align-items: baseline; gap: 8px; }
  .painel-nome { font-size: 15px; font-weight: 600; }
  .texto-preview {
    flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; line-height: 1.55;
    background: var(--cartao); border: 1px solid var(--linha); border-radius: 8px; padding: 11px 12px;
  }
  .campos-resumo { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11.5px; }
  .campos-resumo dt { color: var(--tinta-suave); font-weight: 600; }
  .campos-resumo dd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sem-campos { font-size: 11.5px; color: var(--tinta-suave); font-style: italic; }
  .painel-acoes { display: flex; gap: 8px; }
  .rodape {
    padding: 9px 14px; background: var(--cartao); border-top: 1px solid var(--linha);
  }
  #busca {
position: relative;  }

</style>
</head>
<body>
  <div class="topo">
    <div class="logo" aria-hidden="true"></div>
    <div class="marca">Auto Movidesk</div>
    <div class="busca"><input type="text" id="busca" placeholder="Buscar preset ou comando…" /></div>
    <button class="btn" id="novo">+ Novo</button>
    <button class="btn" id="dashboard">Dashboard &rsaquo;</button>
  </div>

  <div class="corpo">
    <div class="coluna-lista">
      <ul class="lista" id="lista" role="listbox"></ul>
      <div class="contador" id="contador"></div>
    </div>
    <div class="painel" id="painel"></div>
  </div>

  <div class="rodape">
    <div class="linha-switch">
      <div>
        <div style="font-weight:600"><span id="estado-enabled">Extensão ativa</span></div>
        <div class="dica">Responde as enquetes e resolve o status automaticamente.</div>
      </div>
      <label class="switch"><input type="checkbox" id="toggle-enabled" checked /><span class="trilho"></span></label>
    </div>
  </div>

  <div class="toast" id="erro"><span id="erro-texto"></span></div>

<script src="presets.js"></script>
<script src="popup.js"></script>
</body>
</html>
